services:
  # 1. FastAPI Web Backend
  - type: web
    name: robean-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: robean-redis
          property: connectionString

  # 2. Celery Worker (Runs Scrapers)
  - type: worker
    name: robean-celery-worker
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: celery -A celery_stuff.celery_app:celery worker --loglevel=info --pool=threads
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: robean-redis
          property: connectionString

  # 3. Celery Beat (Scheduler)
  - type: worker
    name: robean-celery-beat
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: celery -A celery_stuff.celery_app:celery beat --loglevel=info
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: robean-redis
          property: connectionString

  # 4. Redis (Key Value) Service
  - type: keyvalue
    name: robean-redis
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere