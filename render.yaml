services:
  # Single Web Service running FastAPI + Celery
  - type: web
    name: robean-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: robean-redis
          property: connectionString

  # Redis instance
  - type: keyvalue
    name: robean-redis
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere